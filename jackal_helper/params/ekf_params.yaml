ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true

    # Local EKF owns only odom -> base_link.
    # ArUco corrections are applied separately as map -> odom.
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    # Keep the local odom frame continuous. The Gazebo wheel odometry pose
    # and IMU orientation use different yaw zero references at startup, so
    # fusing both absolute poses can pull the filter between two frames.
    # Fuse wheel velocity instead; vy=0 is the nonholonomic constraint.
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 2.0

    imu0: /imu
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 20
    imu0_differential: false
    # The local odom frame starts at the robot pose. Subtract the initial
    # world-referenced IMU orientation so IMU yaw starts at zero as well.
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
